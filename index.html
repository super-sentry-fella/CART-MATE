    <script>
      // Allow extension request interceptors to assign window.fetch without throwing "has only a getter"
      (function() {
        try {
          var _origFetch = window.fetch;
          if (_origFetch) {
            Object.defineProperty(window, 'fetch', {
              get: function() {
                return _origFetch;
              },
              set: function(fn) {
                _origFetch = fn;
              },
              configurable: true,
              enumerable: true
            });
          }
        } catch (e) {
          try {
            var proto = Object.getPrototypeOf(window);
            if (proto) {
              var _protoFetch = window.fetch;
              Object.defineProperty(proto, 'fetch', {
                get: function() { return _protoFetch; },
                set: function(fn) { _protoFetch = fn; },
                configurable: true,
                enumerable: true
              });
            }
          } catch (err) {}
        }
      })();
    </script>
